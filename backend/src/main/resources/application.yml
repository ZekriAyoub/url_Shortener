spring:
  application:
    name: backend

  #H2 Database Config
  datasource:
    url: jdbc:h2:mem:backend
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  #JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  #H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  base-url: http://localhost:8080

server:
  port: 8080
