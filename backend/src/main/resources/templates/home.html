<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #22c55e;
            --error: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 2rem;
            margin: 0 0 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--muted);
            margin: 0;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input[type="url"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b1222;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input[type="url"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s ease;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .short-url-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .short-url-box code {
            flex: 1;
            background: #0b1222;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .copy-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .list-header h2 {
            font-size: 1.1rem;
            margin: 0;
        }

        .list-header span {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .url-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .url-item:last-child {
            border-bottom: none;
        }

        .url-info {
            min-width: 0;
            flex: 1;
        }

        .url-original {
            color: var(--muted);
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .url-short {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .url-short a {
            color: var(--accent);
            text-decoration: none;
        }

        .url-short a:hover {
            text-decoration: underline;
        }

        .url-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .clicks {
            font-size: 0.8rem;
            color: var(--muted);
            background: #0b1222;
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .delete-form button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 10px;
            font-size: 0.85rem;
        }

        .delete-form button:hover {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        @media (max-width: 520px) {
            form { flex-direction: column; }
            .url-item { flex-direction: column; align-items: flex-start; }
            .url-meta { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🔗 URL Shortener</h1>
        <p>Raccourcis tes liens en un clic</p>
    </header>

    <div class="card">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div th:if="${success}" class="alert alert-success">
            <span>Lien raccourci avec succès !</span>
            <div class="short-url-box">
                <code th:text="${shortUrl}" id="shortUrlText"></code>
                <button type="button" class="copy-btn" onclick="copyShortUrl()">Copier</button>
            </div>
        </div>

        <form th:action="@{/shorten}" method="post">
            <input
                    type="url"
                    name="url"
                    placeholder="https://exemple.com/mon-url-tres-longue"
                    required
                    autofocus
            />
            <button type="submit">Raccourcir</button>
        </form>
    </div>

    <div class="card">
        <div class="list-header">
            <h2>Tes liens</h2>
            <span th:text="${#lists.size(urls)} + ' au total'"></span>
        </div>

        <div th:if="${#lists.isEmpty(urls)}" class="empty-state">
            Aucun lien pour le moment. Raccourcis-en un ci-dessus.
        </div>

        <div th:each="url : ${urls}" class="url-item">
            <div class="url-info">
                <div class="url-short">
                    <a th:href="@{'/' + ${url.shortCode}}" th:text="'/' + ${url.shortCode}" target="_blank"></a>
                </div>
                <div class="url-original" th:text="${url.originalUrl}"></div>
            </div>
            <div class="url-meta">
                <span class="clicks" th:text="${url.clickCount} + ' clics'"></span>
                <form
                        class="delete-form"
                        th:action="@{'/delete/' + ${url.id}}"
                        method="post"
                        onsubmit="return confirm('Supprimer ce lien ?');"
                >
                    <button type="submit">Supprimer</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function copyShortUrl() {
        var text = document.getElementById('shortUrlText').innerText;
        navigator.clipboard.writeText(text).then(function () {
            var btn = document.querySelector('.copy-btn');
            var original = btn.textContent;
            btn.textContent = 'Copié !';
            setTimeout(function () { btn.textContent = original; }, 1500);
        });
    }
</script>
</body>
</html>
